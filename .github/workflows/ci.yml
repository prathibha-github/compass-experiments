name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  COMPASS_REVISION: 8bc4bd4b90a66f8a04d7d31dbeba91d9e54cab70

jobs:
  cli-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out compass_experiments
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-base.txt

      - name: Install dependencies
        run: |
          pip install "compass-eval[openai,anthropic,google] @ git+https://x-access-token:${{ secrets.COMPASS_PAT }}@github.com/prathibha-github/compass.git@${COMPASS_REVISION}"
          pip install -r requirements-base.txt pytest

      - name: Run CLI smoke tests
        run: pytest tests/test_cli_entrypoints.py -q

  test:
    runs-on: ubuntu-latest
    needs: cli-smoke

    steps:
      - name: Check out compass_experiments
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-base.txt

      - name: Install dependencies
        run: |
          pip install "compass-eval[openai,anthropic,google] @ git+https://x-access-token:${{ secrets.COMPASS_PAT }}@github.com/prathibha-github/compass.git@${COMPASS_REVISION}"
          pip install -r requirements-base.txt pytest

      - name: Run tests
        run: pytest tests/ -q
