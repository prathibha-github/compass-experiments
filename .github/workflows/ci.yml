name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cli-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out compass
        uses: actions/checkout@v4
        with:
          repository: prathibha-github/compass
          token: ${{ secrets.COMPASS_PAT }}
          path: compass

      - name: Check out helm_eval_lex_quirks
        uses: actions/checkout@v4
        with:
          path: helm_eval_lex_quirks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: helm_eval_lex_quirks/requirements.txt

      - name: Install dependencies
        working-directory: helm_eval_lex_quirks
        run: pip install -r requirements.txt pytest

      - name: Run CLI smoke tests
        working-directory: helm_eval_lex_quirks
        run: pytest tests/test_cli_entrypoints.py -q

  test:
    runs-on: ubuntu-latest
    needs: cli-smoke

    steps:
      # Check out compass first so it lands at ../compass relative to this repo,
      # matching the -e ../compass entry in requirements.txt.
      - name: Check out compass
        uses: actions/checkout@v4
        with:
          repository: prathibha-github/compass
          token: ${{ secrets.COMPASS_PAT }}
          path: compass

      - name: Check out helm_eval_lex_quirks
        uses: actions/checkout@v4
        with:
          path: helm_eval_lex_quirks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: helm_eval_lex_quirks/requirements.txt

      - name: Install dependencies
        working-directory: helm_eval_lex_quirks
        run: pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: helm_eval_lex_quirks
        run: pytest tests/ -q
